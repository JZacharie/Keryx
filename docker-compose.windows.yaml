services:
  orchestrator:
    build:
      context: .
      dockerfile: services/orchestrator/Dockerfile
    image: keryx-orchestrator
    container_name: keryx-orchestrator
    ports:
      - "3000:3000"
    environment:
      - REDIS_URL=redis://redis:6379
      - S3_ENDPOINT=http://minio:9000
      - S3_BUCKET=keryx
      - S3_ACCESS_KEY_ID=minioadmin
      - S3_SECRET_ACCESS_KEY=minioadmin
      - AWS_ACCESS_KEY_ID=minioadmin
      - AWS_SECRET_ACCESS_KEY=minioadmin
      - AWS_REGION=us-east-1
      - EXTRACTOR_URL=http://keryx-extractor:8000
      - DEWATERMARK_URL=http://keryx-dewatermark:8000
      - VOICE_EXTRACTOR_URL=http://keryx-voice-extractor:8000
      - TEXTS_TRANSLATION_URL=http://keryx-texts-translation:8000
      - VIDEO_COMPOSER_URL=http://keryx-video-composer:8000
      - VIDEO_GENERATOR_URL=http://keryx-video-generator:8000
      - VOICE_CLONER_URL=http://keryx-voices-cloner:8000
      - VOICES_COMPOSER_URL=http://voices-composer:8000
      - VOICE_CLONER_GPT_URL=http://keryx-voice-cloner-gpt:8000
      - DIFFUSION_URL=http://keryx-diffusion-engine:8000
      - PPTX_URL=http://keryx-pptx-builder:8000
      - SCALING_MODE=compose
      - API_KEY=${API_KEY:-0123456789}
      - HOST_SHARED_DIR=e:\git\JZacharie\Keryx\shared_data
    depends_on:
      - redis
      - minio
      - create-buckets
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./shared_data:/mnt/shared
    networks:
      - keryx-net
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # ── Workers (manual profile = built but not auto-started) ──
  # The orchestrator creates these dynamically as needed.
  keryx-extractor:
    build:
      context: ./services/extractor
    image: keryx-extractor
    profiles: ["manual"]
    environment:
      - PORT=8000
      - S3_ENDPOINT=http://minio:9000
      - S3_ACCESS_KEY_ID=minioadmin
      - S3_SECRET_ACCESS_KEY=minioadmin
      - S3_BUCKET=keryx
    networks:
      - keryx-net

  keryx-dewatermark:
    build:
      context: ./services/dewatermark
    image: keryx-dewatermark
    profiles: ["manual"]
    environment:
      - PORT=8000
      - S3_ENDPOINT=http://minio:9000
      - S3_ACCESS_KEY_ID=minioadmin
      - S3_SECRET_ACCESS_KEY=minioadmin
      - S3_BUCKET=keryx
    networks:
      - keryx-net

  keryx-voice-extractor:
    build:
      context: ./services/voice-extractor
    image: keryx-voice-extractor
    profiles: ["manual"]
    environment:
      - PORT=8000
      - WHISPER_MODEL=medium
      - S3_ENDPOINT=http://minio:9000
      - S3_ACCESS_KEY_ID=minioadmin
      - S3_SECRET_ACCESS_KEY=minioadmin
      - S3_BUCKET=keryx
    volumes:
      - keryx-cache:/app/.cache/whisper
    networks:
      - keryx-net

  keryx-texts-translation:
    build:
      context: ./services/texts-translation
    image: keryx-texts-translation
    profiles: ["manual"]
    environment:
      - PORT=8000
      - OLLAMA_URL=${OLLAMA_URL:-http://host.docker.internal:11434}
      - OLLAMA_MODEL=${OLLAMA_MODEL:-llama3}
      - TRANSLATOR_BACKEND=ollama
      - S3_ENDPOINT=http://minio:9000
      - S3_ACCESS_KEY=minioadmin
      - S3_SECRET_KEY=minioadmin
      - S3_BUCKET=keryx-cache
    networks:
      - keryx-net
    extra_hosts:
      - "host.docker.internal:host-gateway"

  keryx-video-composer:
    build:
      context: ./services/video-composer
    image: keryx-video-composer
    profiles: ["manual"]
    environment:
      - PORT=8000
      - VIDEO_ENCODER=h264_nvenc
      - S3_ENDPOINT=http://minio:9000
      - S3_ACCESS_KEY_ID=minioadmin
      - S3_SECRET_ACCESS_KEY=minioadmin
      - S3_BUCKET=keryx
    networks:
      - keryx-net

  voices-composer:
    build:
      context: ./services/video-composer
    image: voices-composer
    profiles: ["manual"]
    environment:
      - PORT=8000
      - SERVICE_NAME=voices-composer
      - S3_ENDPOINT=http://minio:9000
      - S3_ACCESS_KEY_ID=minioadmin
      - S3_SECRET_ACCESS_KEY=minioadmin
      - S3_BUCKET=keryx
    networks:
      - keryx-net

  keryx-video-generator:
    build:
      context: ./services/video-generator
    image: keryx-video-generator
    profiles: ["manual"]
    environment:
      - PORT=8000
      - S3_ENDPOINT=http://minio:9000
      - S3_ACCESS_KEY_ID=minioadmin
      - S3_SECRET_ACCESS_KEY=minioadmin
      - S3_BUCKET=keryx
    volumes:
      - hf-models:/app/huggingface
    networks:
      - keryx-net

  keryx-voices-cloner:
    build:
      context: ./services/voice-cloner
    image: keryx-voices-cloner
    profiles: ["manual"]
    environment:
      - PORT=8000
      - S3_ENDPOINT=http://minio:9000
      - S3_ACCESS_KEY_ID=minioadmin
      - S3_SECRET_ACCESS_KEY=minioadmin
      - S3_BUCKET=keryx
    volumes:
      - coqui-models:/root/.local/share/tts
    networks:
      - keryx-net

  keryx-voice-cloner-gpt:
    build:
      context: ./services/voice-cloner-gpt
    image: keryx-voice-cloner-gpt
    profiles: ["manual"]
    environment:
      - PORT=8000
      - S3_ENDPOINT=http://minio:9000
      - S3_ACCESS_KEY_ID=minioadmin
      - S3_SECRET_ACCESS_KEY=minioadmin
      - S3_BUCKET=keryx
    volumes:
      - ./services/voice-cloner-gpt/GPT_weights:/app/GPT_weights
      - ./services/voice-cloner-gpt/SoVITS_weights:/app/SoVITS_weights
      - ./services/voice-cloner-gpt/reference:/app/reference
    networks:
      - keryx-net

  keryx-diffusion-engine:
    build:
      context: ./services/diffusion-engine
    image: keryx-diffusion-engine
    profiles: ["manual"]
    environment:
      - PORT=8000
      - S3_ENDPOINT=http://minio:9000
      - S3_ACCESS_KEY_ID=minioadmin
      - S3_SECRET_ACCESS_KEY=minioadmin
      - S3_BUCKET=keryx
    volumes:
      - hf-models:/app/huggingface
    networks:
      - keryx-net

  keryx-pptx-builder:
    build:
      context: ./services/pptx-builder
    image: keryx-pptx-builder
    profiles: ["manual"]
    environment:
      - PORT=8000
      - S3_ENDPOINT=http://minio:9000
      - S3_ACCESS_KEY_ID=minioadmin
      - S3_SECRET_ACCESS_KEY=minioadmin
      - S3_BUCKET=keryx
    networks:
      - keryx-net

  redis:
    image: redis:7-alpine
    container_name: keryx-redis
    ports:
      - "6379:6379"
    networks:
      - keryx-net

  minio:
    image: minio/minio:latest
    container_name: keryx-minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=minioadmin
    command: server /data --console-address ":9001"
    networks:
      - keryx-net
    volumes:
      - minio-data:/data

  create-buckets:
    image: minio/mc:latest
    container_name: keryx-create-buckets
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      until (/usr/bin/mc alias set localminio http://minio:9000 minioadmin minioadmin) do echo 'Waiting for MinIO...' && sleep 1; done;
      /usr/bin/mc mb --ignore-existing localminio/keryx;
      /usr/bin/mc mb --ignore-existing localminio/keryx-cache;
      /usr/bin/mc policy set public localminio/keryx;
      /usr/bin/mc policy set public localminio/keryx-cache;
      exit 0;
      "
    networks:
      - keryx-net

  frontend:
    build:
      context: ./services/frontend
      args:
        - NEXT_PUBLIC_API_URL=http://localhost:3000
    image: keryx-frontend
    container_name: keryx-frontend
    ports:
      - "8000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:3000
    networks:
      - keryx-net

networks:
  keryx-net:
    driver: bridge

volumes:
  coqui-models:
  keryx-cache:
  hf-models:
  minio-data:
