networks:
  keryx-net:
    driver: bridge

volumes:
  coqui-models:
  keryx-cache:
  hf-models:

services:
  # ── Core Infrastructure (start with docker compose up) ──────────
  redis:
    image: redis:7-alpine
    container_name: keryx-redis
    networks:
      - keryx-net

  frontend:
    build:
      context: ./services/frontend
      args:
        - NEXT_PUBLIC_API_URL=http://localhost:3000
    image: keryx-frontend
    container_name: keryx-frontend
    ports:
      - "8000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:3000
    networks:
      - keryx-net

  orchestrator:
    build:
      context: .
      dockerfile: services/orchestrator/Dockerfile
    image: keryx-orchestrator
    container_name: keryx-orchestrator
    ports:
      - "3000:3000"
    environment:
      - REDIS_URL=redis://redis:6379
      - S3_ENDPOINT=${S3_ENDPOINT:-https://minio-170-api.zacharie.org}
      - S3_BUCKET=${S3_BUCKET:-keryx}
      - S3_ACCESS_KEY_ID=${S3_ACCESS_KEY_ID:-keryx}
      - S3_SECRET_ACCESS_KEY=${S3_SECRET_ACCESS_KEY:-keryx_secret}
      - SCALING_MODE=compose
      - OTEL_ENDPOINT=http://o2-openobserve-router.openobserve.svc:5080
      - OTEL_AUTH_TOKEN=Basic am9zZXBoQHphY2hhcmllLm9yZzpTdXBlcm1hbi02OTIzMA==
      - API_KEY=${API_KEY:-changeme}
      - DOCKER_NETWORK=keryx_keryx-net
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      - redis
    networks:
      - keryx-net

  # ── AI Workers (defined for build; started on-demand by orchestrator) ──
  # Build with:  docker compose --profile manual build
  # Or all at once: docker compose --profile manual build --parallel
  keryx-extractor:
    build:
      context: ./services/extractor
    image: keryx-extractor
    container_name: keryx-extractor
    profiles: ["manual"]
    environment:
      - PORT=8000
    env_file:
      - .env
    networks:
      - keryx-net

  keryx-dewatermark:
    build:
      context: ./services/dewatermark
    image: keryx-dewatermark
    container_name: keryx-dewatermark
    profiles: ["manual"]
    environment:
      - PORT=8000
    env_file:
      - .env
    networks:
      - keryx-net

  keryx-voice-extractor:
    build:
      context: ./services/voice-extractor
    image: keryx-voice-extractor
    container_name: keryx-voice-extractor
    profiles: ["manual"]
    environment:
      - PORT=8000
      - WHISPER_MODEL=medium
      - TRANSLATOR_BACKEND=ollama
    env_file:
      - .env
    volumes:
      - keryx-cache:/app/.cache/whisper
    networks:
      - keryx-net

  keryx-texts-translation:
    build:
      context: ./services/texts-translation
    image: keryx-texts-translation
    container_name: keryx-texts-translation
    profiles: ["manual"]
    environment:
      - PORT=8000
      - OLLAMA_URL=http://ollama.ollama.svc.cluster.local:11434
      - TRANSLATOR_BACKEND=ollama
    env_file:
      - .env
    networks:
      - keryx-net

  keryx-video-composer:
    build:
      context: ./services/video-composer
    image: keryx-video-composer
    container_name: keryx-video-composer
    profiles: ["manual"]
    environment:
      - PORT=8000
      - VIDEO_ENCODER=h264_nvenc
    env_file:
      - .env
    networks:
      - keryx-net

  voices-composer:
    build:
      context: ./services/video-composer
    image: voices-composer
    container_name: voices-composer
    profiles: ["manual"]
    environment:
      - PORT=8000
      - SERVICE_NAME=voices-composer
    env_file:
      - .env
    networks:
      - keryx-net

  keryx-video-generator:
    build:
      context: ./services/video-generator
    image: keryx-video-generator
    container_name: keryx-video-generator
    profiles: ["manual"]
    environment:
      - PORT=8000
    env_file:
      - .env
    volumes:
      - hf-models:/app/huggingface
    networks:
      - keryx-net

  keryx-voices-cloner:
    build:
      context: ./services/voice-cloner
    image: keryx-voices-cloner
    container_name: keryx-voices-cloner
    profiles: ["manual"]
    environment:
      - PORT=8000
    env_file:
      - .env
    volumes:
      - coqui-models:/root/.local/share/tts
    networks:
      - keryx-net

  keryx-voice-cloner-gpt:
    build:
      context: ./services/voice-cloner-gpt
    image: keryx-voice-cloner-gpt
    container_name: keryx-voice-cloner-gpt
    profiles: ["manual"]
    environment:
      - PORT=8000
    env_file:
      - .env
    volumes:
      - ./services/voice-cloner-gpt/GPT_weights:/app/GPT_weights
      - ./services/voice-cloner-gpt/SoVITS_weights:/app/SoVITS_weights
      - ./services/voice-cloner-gpt/reference:/app/reference
    networks:
      - keryx-net

  keryx-diffusion-engine:
    build:
      context: ./services/diffusion-engine
    image: keryx-diffusion-engine
    container_name: keryx-diffusion-engine
    profiles: ["manual"]
    environment:
      - PORT=8000
    env_file:
      - .env
    volumes:
      - hf-models:/app/huggingface
    networks:
      - keryx-net

  keryx-pptx-builder:
    build:
      context: ./services/pptx-builder
    image: keryx-pptx-builder
    container_name: keryx-pptx-builder
    profiles: ["manual"]
    environment:
      - PORT=8000
    env_file:
      - .env
    networks:
      - keryx-net
